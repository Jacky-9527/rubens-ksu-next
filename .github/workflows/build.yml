name: Build KernelSU Next for rubens (Redmi K50)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl wget build-essential flex bison bc \
            libssl-dev libelf-dev libncurses-dev python3 cpio rsync \
            gcc-aarch64-linux-gnu

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b rubens-s-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel_src
          cd kernel_src
          git clone --depth=1 \
            https://github.com/MiCode/MTK_kernel_modules.git \
            -b rubens-s-oss kernel_modules

      - name: Download toolchains
        run: |
          cd kernel_src
          # Download Proton Clang (pre-built, reliable)
          echo "=== Downloading Proton Clang ==="
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "Proton Clang version:"
          clang/bin/clang --version 2>/dev/null || echo "clang not found at clang/bin/"
          ls clang/bin/ | head -20
          # GCC 64-bit (from Linaro mirror, not Google)
          echo "=== Downloading GCC 64-bit ==="
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64 2>/dev/null || \
          git clone --depth=1 https://github.com/arter97/arm64-gcc.git gcc64
          # GCC 32-bit
          echo "=== Downloading GCC 32-bit ==="
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32 2>/dev/null || \
          git clone --depth=1 https://github.com/arter97/arm32-gcc.git gcc32
          echo "=== Toolchains ready ==="

      - name: Integrate KernelSU Next (legacy)
        run: |
          cd kernel_src
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/legacy/kernel/setup.sh" | bash -s legacy
          echo "KernelSU Next integrated"

      - name: Enable KSU configs & fix broken drivers
        run: |
          cd kernel_src
          # Enable kprobes (required by KSU)
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --enable KPROBES
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --enable KPROBE_EVENTS
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --enable HAVE_KPROBES
          # Enable KernelSU
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --enable KSU
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --enable KSU_KPROBE_HOOKS
          # Disable broken RPMB driver (missing mtk_mmc_host symbol)
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --disable RPMB
          # Show added configs
          echo "=== KSU/KPROBE configs ==="
          grep -E "KSU|KPROBE" arch/arm64/configs/rubens_defconfig
          echo "=== RPMB configs ==="
          grep -E "RPMB" arch/arm64/configs/rubens_defconfig
          # Disable CONFIG_WERROR if present
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --disable WERROR
          # Enable DEVFREQ (UFS driver needs devfreq_simple_ondemand_data struct)
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --enable DEVFREQ
          ./scripts/config --file arch/arm64/configs/rubens_defconfig --enable DEVFREQ_GOV_SIMPLE_ONDEMAND

      - name: Patch MTK kernel source
        run: |
          cd kernel_src
          # MTK open-source drivers hardcode -Werror in their Makefiles
          # Replace -Werror with -Wno-error so Clang doesn't fail on warnings
          # (must not delete -Werror entirely, or -Werror=foo becomes =foo)
          find . -name Makefile -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find . -name Kbuild -exec sed -i 's/-Werror/-Wno-error/g' {} +
          echo "=== Stripped -Werror from all Makefiles/Kbuild ==="
          grep -r "Werror" drivers/ --include="Makefile" --include="Kbuild" | head -5 || echo "No -Werror remaining"
          # Create stub headers for missing MTK proprietary files
          echo '/* stub: disp_arr.h is MTK proprietary, not in open source */' > drivers/gpu/mediatek/ged/src/disp_arr.h
          echo '/* stub: mtk_drm_arr.h is MTK proprietary, not in open source */' > drivers/gpu/drm/mediatek/mediatek_v2/mtk_drm_arr.h 2>/dev/null || mkdir -p drivers/gpu/drm/mediatek/mediatek_v2 && echo '/* stub */' > drivers/gpu/drm/mediatek/mediatek_v2/mtk_drm_arr.h
          echo "=== Created stub headers ==="
          # Patch ufshcd.h: provide devfreq_simple_ondemand_data stub if not defined
          sed -i '/#include <linux\/devfreq.h>/a #ifndef CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND\nstruct devfreq_simple_ondemand_data { unsigned int upthreshold; unsigned int downdifferential; };\n#endif' drivers/scsi/ufs/ufshcd.h
          echo "=== Patched ufshcd.h devfreq stub ==="
          # Remove MTK custom proc_compat_ioctl field (not in standard proc_ops)
          find drivers/misc/mediatek -name '*.c' -exec sed -i '/proc_compat_ioctl/d' {} +
          echo "=== Removed proc_compat_ioctl ==="

      - name: Build kernel
        run: |
          cd kernel_src
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=$(pwd)/clang/bin
          export PATH="$CLANG_PATH:$PATH"
          export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
          
          # Verify toolchain
          echo "=== Clang version ==="
          clang --version || echo "WARNING: clang not found"
          echo "=== GCC version ==="
          ${CROSS_COMPILE}gcc --version || echo "WARNING: gcc64 not found"
          echo "=== GCC32 version ==="
          ${CROSS_COMPILE_ARM32}gcc --version || echo "WARNING: gcc32 not found"
          
          # Generate config
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            rubens_defconfig
          
          # Build with auto-stub creation for missing MTK proprietary headers
          # The MTK open-source kernel is missing many proprietary headers;
          # we auto-create empty stubs and retry until build succeeds or fails
          # with a non-header error.
          BUILD_SUCCESS=0
          for attempt in $(seq 1 10); do
            echo "=== Build attempt $attempt ==="
            make O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              KCFLAGS="-Wno-error" \
              -j$(nproc) 2>&1 | tee -a build.log
            
            if [ -f out/arch/arm64/boot/Image ]; then
              echo "BUILD SUCCESS!"
              ls -lh out/arch/arm64/boot/Image
              ls -lh out/arch/arm64/boot/Image.gz 2>/dev/null || echo "No Image.gz"
              ls -lh out/arch/arm64/boot/Image.lz4 2>/dev/null || echo "No Image.lz4"
              BUILD_SUCCESS=1
              break
            fi
            
            # Check for missing headers (fatal error: 'xxx.h' file not found)
            missing=$(grep "fatal error:.*file not found" build.log | tail -20 | sed "s/.*fatal error: '\([^']*\)' file not found.*/\1/" | sort -u)
            
            if [ -z "$missing" ]; then
              echo "BUILD FAILED (non-header error)!"
              echo "=== Last 100 lines of build.log ==="
              tail -100 build.log
              exit 1
            fi
            
            echo "=== Missing headers, creating stubs: ==="
            for h in $missing; do
              echo "  Stubbing: $h"
              bn=$(basename "$h")
              # Create stub in all common include directories
              for dir in include include/linux drivers/misc/mediatek/include \
                         drivers/misc/mediatek/masp/asfv2/asf_export_inc \
                         drivers/misc/mediatek/ccci_util; do
                if [ -d "$dir" ] && [ ! -f "$dir/$bn" ]; then
                  echo "/* stub: $h - MTK proprietary */" > "$dir/$bn"
                fi
              done
              # Also create next to the source file that includes it (for "xxx.h" includes)
              src_file=$(grep -rl "#include.*$bn" drivers/ --include="*.c" --include="*.h" 2>/dev/null | head -1)
              if [ -n "$src_file" ]; then
                src_dir=$(dirname "$src_file")
                if [ ! -f "$src_dir/$bn" ]; then
                  echo "/* stub: $h */" > "$src_dir/$bn"
                fi
              fi
            done
            echo "=== Stubs created, retrying... ==="
          done
          
          if [ $BUILD_SUCCESS -eq 0 ]; then
            echo "BUILD FAILED after all attempts!"
            echo "=== Last 100 lines of build.log ==="
            tail -100 build.log
            exit 1
          fi

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: rubens-ksu-next-kernel
          path: |
            kernel_src/out/arch/arm64/boot/Image
            kernel_src/out/arch/arm64/boot/Image.gz
            kernel_src/build.log
          if-no-files-found: error